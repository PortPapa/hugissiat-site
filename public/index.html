<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>후기씨앗 - 내 블로그 결 그대로 글쓰기</title>
<meta name="description" content="내 네이버 블로그의 글 구성과 디자인 결을 분석해서, 후기씨앗 경험 기록으로 내가 쓴 것 같은 블로그 글을 만들어요.">
<meta property="og:title" content="후기씨앗 - 내 블로그 결 그대로 글쓰기">
<meta property="og:description" content="AI 글은 많아도, 내 경험은 나만 써요.">
<meta property="og:image" content="https://app.hugissiat.com/img/feature-1024x500.png">
<meta name="theme-color" content="#6F8E6D">
<link rel="icon" href="/app/img/icon-512.png">
<link rel="stylesheet" href="https://editor-static.pstatic.net/v/basic/1.78.1/css/se.viewer.desktop.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-gothic.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-myeongjo.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-barun-gothic.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square.css">
<link rel="stylesheet" href="/s/studio.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/"><i><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 40 V22" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M24 28 C15 28 10 21 10 15 C18 15 24 21 24 28Z" fill="currentColor" opacity=".75"/><path d="M24 23 C25 14 32 8 39 8 C38 17 31 23 24 23Z" fill="currentColor"/></svg></i>후기씨앗</a>
  <nav><a href="#studio" class="on">글쓰기 설정</a><a href="https://app.hugissiat.com">앱</a></nav>
</header>

<section class="intro">
  <h1>내 블로그 <em>결 그대로</em>,<br>내 경험으로 쓰는 글</h1>
  <p>블로그를 넣으면 글 구성과 디자인을 읽어 오고,<br>후기씨앗에 남긴 경험으로 내가 쓴 것 같은 글을 만들어요.</p>
  <ol class="flow"><li><b>1</b>내 블로그 불러오기</li><li><b>2</b>글 구성 고르기</li><li><b>3</b>디자인 다듬기</li><li><b>4</b>설정 받기 → Aside가 임시저장</li></ol>
</section>

<main id="studio" class="studio">
  <aside class="left">
    <div class="card">
      <div class="h">내 블로그</div>
      <div class="blogs" id="blogs"></div>
      <form class="blog-in" id="blogForm"><input id="blogId" placeholder="블로그 주소나 아이디" autocomplete="off"><button type="submit">불러오기</button></form>
      <label class="chk"><input type="checkbox" id="reviewOnly" checked> 사진 많은 후기 글만</label>
      <div id="anaBox" class="ana"></div>
    </div>
    <div class="card">
      <div class="h">글 구성</div>
      <div id="tpls" class="tpls"></div>
    </div>
  </aside>

  <section class="center">
    <div class="se-bar" id="seBar"></div>
    <div class="paper-wrap">
      <div class="paper-tools"><button type="button" id="viewMobile" class="on">모바일</button><button type="button" id="viewPc">PC</button><label class="chk sm"><input type="checkbox" id="showSrc" checked> 경험 기록 연결 보기</label></div>
      <div class="paper" id="paper">
        <div class="doc-title" id="docTitle"></div>
        <div class="se-viewer se-theme-default" lang="ko-KR"><div class="se-main-container" id="doc"></div></div>
      </div>
    </div>
  </section>

  <aside class="right">
    <div class="card">
      <div class="h">디자인 결 <span class="from" id="designFrom"></span></div>
      <div id="design"></div>
    </div>
    <div class="card" id="toneCard" hidden>
      <div class="h">말투</div>
      <div id="tone"></div>
    </div>
    <div class="card out">
      <div class="h">내 글쓰기 설정</div>
      <p class="mut">Aside 스킬이 이 설정과 후기씨앗 경험 기록으로 글을 써서 네이버에 임시저장해요.</p>
      <button type="button" class="btn" id="dl">설정 파일 받기</button>
      <button type="button" class="btn ghost" id="cp">복사하기</button>
    </div>
  </aside>
</main>

<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast"></div>

<script src="/s/templates.js"></script>
<script src="/s/studio.js"></script>
</body>
</html>
